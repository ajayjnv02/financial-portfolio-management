server:
  port: 18080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433:userdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/fpm-realm

graphql:
  servlet:
    mapping: /graphql
  tools:
    schema-location-pattern: "**/*.graphqls"

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

